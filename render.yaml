services:
  - type: web
    name: repurpose-ai-studio
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: FLASK_ENV
        value: "production"
      - key: SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        value: "postgresql://postgres:cbm%40cbsl%23123@db.knnkuwbjzbdktpejxork.supabase.co:5432/postgres?sslmode=require"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
